[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musculoskeletal-hand-simulation"
version = "0.1.0"
description = "Physical-state inspection of the official MyoSuite musculoskeletal hand"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Santiago Florido Gomez"}]
dependencies = [
  "myosuite==3.0.0",
  "myo-sim==0.2.3",
  "mujoco==3.16.0",
  "numpy>=2,<3",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hand_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["graphics: requires an explicitly enabled graphical display"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
